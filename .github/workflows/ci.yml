name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: slaveofai, POSTGRES_PASSWORD: slaveofai, POSTGRES_DB: slaveofai }
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U slaveofai" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: cp .env.example .env
      - run: PGPASSWORD=slaveofai psql -h localhost -p 5433 -U slaveofai -d slaveofai -c 'CREATE DATABASE slaveofai_test OWNER slaveofai;'
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run db:migrate:test
      - run: npm run db:seed
      - run: npm run typecheck
      - run: npm test
      - run: npm run web:build && rm -rf apps/web/.next
  gates:
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: slaveofai, POSTGRES_PASSWORD: slaveofai, POSTGRES_DB: slaveofai }
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U slaveofai" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SLAVEOFAI_CLAUDE_BIN: ${{ github.workspace }}/scripts/gate-fakes/fake-claude.sh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npx playwright@$(node -p "require('playwright-core/package.json').version") install --with-deps chromium
      - run: echo "CHROMIUM_PATH=$(node -e "console.log(require('playwright-core').chromium.executablePath())")" >> "$GITHUB_ENV"
      - run: cp .env.example .env
      - run: PGPASSWORD=slaveofai psql -h localhost -p 5433 -U slaveofai -d slaveofai -c 'CREATE DATABASE slaveofai_test OWNER slaveofai;'
      - run: npm run db:generate && npm run db:migrate && npm run db:migrate:test && npm run db:seed
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: npm run gate:m15-boundary
      - run: npm run gate:m20-auth
      - run: npm run gate:m21-loose-ends
      - run: npm run gate:m23-onboarding

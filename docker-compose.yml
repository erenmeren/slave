services:
  postgres:
    image: postgres:17-alpine
    container_name: slaveofai-postgres
    environment:
      POSTGRES_USER: slaveofai
      POSTGRES_PASSWORD: slaveofai
      POSTGRES_DB: slaveofai
    ports:
      - "5433:5432"
    volumes:
      - slaveofai-pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slaveofai -d slaveofai"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  slaveofai-pgdata:
